name: test

on:
  push:
    branches: [ develop, main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs/**'
      - 'releases/**'
  pull_request:
    branches: [ develop, main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs/**'
      - 'releases/**'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Diagnose packaged extension interaction
        continue-on-error: true
        run: pnpm test:e2e:extension
      - name: Compare without moved frame input intervention
        env:
          DISABLE_MOVED_FRAME_GUARD: '1'
        run: pnpm exec playwright test --config playwright.extension.config.ts --grep 'renders Markdown' --repeat-each 3
