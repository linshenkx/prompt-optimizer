name: test

on:
  push:
    branches: [ develop, main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs/**'
      - 'releases/**'
  pull_request:
    branches: [ develop, main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs/**'
      - 'releases/**'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run repo and gate checks
        run: pnpm test:gate

      - name: Check SQLite concurrency, interrupted migrations and business recovery
        run: node --test scripts/sqlite-storage.test.mjs scripts/sqlite-migration.test.mjs scripts/sqlite-business-regression.test.mjs

      - name: Check desktop MCP read-only access and legacy compatibility
        run: |
          pnpm --filter @prompt-optimizer/core test:asset-reader
          pnpm --filter @prompt-optimizer/mcp-server build
          pnpm --filter @prompt-optimizer/mcp-server test:desktop-readonly
          pnpm --filter @prompt-optimizer/mcp-server test:desktop-stdio

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real UI smoke and gate E2E checks
        run: pnpm test:gate:e2e
