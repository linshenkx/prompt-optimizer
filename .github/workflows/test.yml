name: test

on:
  push:
    branches: [ develop, main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs/**'
      - 'releases/**'
  pull_request:
    branches: [ develop, main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'mkdocs/**'
      - 'releases/**'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run repo and gate checks
        run: pnpm test:gate

      - name: Check SQLite concurrency, interrupted migrations and business recovery
        run: node --test scripts/sqlite-storage.test.mjs scripts/sqlite-migration.test.mjs scripts/sqlite-business-regression.test.mjs

      - name: Check MCP business operations and source access
        run: |
          pnpm --filter @prompt-optimizer/core test:asset-reader
          pnpm --filter @prompt-optimizer/mcp-server build
          pnpm --filter @prompt-optimizer/mcp-server test:desktop-readonly
          pnpm --filter @prompt-optimizer/mcp-server test:desktop-stdio
          pnpm --filter @prompt-optimizer/mcp-server test:desktop-business
          pnpm --filter @prompt-optimizer/mcp-server test:browser

      - name: Check the Docker HTTP MCP service
        run: |
          pnpm --filter @prompt-optimizer/mcp-server build:docker
          node --test packages/mcp-server/tests/docker-http.acceptance.mjs

      - name: Test the packed MCP server on Node 24, 25 and 26
        run: |
          dir="$RUNNER_TEMP/mcp-runtime"
          pnpm --filter @prompt-optimizer/mcp-server pack:npm --out-dir "$dir"
          cd "$dir"
          node "$GITHUB_WORKSPACE/packages/mcp-server/tests/npm-package.acceptance.mjs" "$dir"/prompt-optimizer-mcp-server-*.tgz
          tar -xzf prompt-optimizer-mcp-server-*.tgz
          mkdir package/tests
          cp "$GITHUB_WORKSPACE"/packages/mcp-server/tests/desktop*.acceptance.mjs package/tests/
          ln -s "$GITHUB_WORKSPACE/packages/mcp-server/node_modules" package/node_modules
          for version in 24.0.0 25.0.0 26.0.0; do
            npm exec --yes --package="node@$version" -- npm install --dry-run --engine-strict --no-audit --no-fund ./prompt-optimizer-mcp-server-*.tgz
            npm exec --yes --package="node@$version" -- node --test --test-concurrency=1 package/tests/*.mjs
          done

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real UI smoke and gate E2E checks
        run: pnpm test:gate:e2e
